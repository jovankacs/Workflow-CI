name: CI - Train and Deploy Model

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.12'
          activate-environment: mlproject-env

      - name: Install MLflow and Dependencies
        shell: bash -el {0}
        run: |
          pip install mlflow==2.19.0 dagshub scikit-learn pandas numpy matplotlib

      - name: Train Model with MLflow Project
        shell: bash -el {0}
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/jovankacs/Membangun_model.mlflow
        run: |
          cd MLProject
          mlflow run . --env-manager=local \
            -P n_estimators=200 \
            -P max_depth=5 \
            -P min_samples_split=2

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/artifacts/

      - name: Commit Artifacts to Repository
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p artifacts
          cp -r MLProject/artifacts/* artifacts/ 2>/dev/null || true
          git add artifacts/
          git diff --staged --quiet || git commit -m "Auto: update model artifacts from CI"
          git push

      - name: Build Docker Image
        shell: bash -el {0}
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/jovankacs/Membangun_model.mlflow
        run: |
          RUN_ID=$(python -c "
          import mlflow, os
          mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
          runs = mlflow.search_runs(experiment_names=['heart-disease-ci'], order_by=['start_time DESC'])
          print(runs.iloc[0]['run_id'])
          ")
          echo "Run ID: $RUN_ID"
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "jovankacs/heart-disease-model" \
            --env-manager local

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push jovankacs/heart-disease-model:latest